services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://gym:${POSTGRES_PASSWORD}@postgres:5432/gym
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEFAULT_CLIENT_PASSWORD: ${DEFAULT_CLIENT_PASSWORD}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      PORT: "8080"
    volumes:
      - ./uploads:/app/uploads

  web-admin:
    build: ./web-admin
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
