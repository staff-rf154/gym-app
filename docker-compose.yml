services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Монтируем наши файлы в отдельную директорию внутри контейнера
      - ./postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    # Указываем PostgreSQL, где искать конфигурацию
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ./backend
    command: sh -c "export PATH=/app/node_modules/.bin:$$PATH && prisma migrate deploy && prisma db seed && node dist/src/main.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://gym:${POSTGRES_PASSWORD}@postgres:5432/gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEFAULT_CLIENT_PASSWORD: ${DEFAULT_CLIENT_PASSWORD}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      PORT: "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./secrets:/app/secrets:ro

  web-admin:
    build: ./web-admin
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
